name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the spreadsheet reader
        run: pip install openpyxl

      # the smoke test drives this through --dump-dom; no automation library needed
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      # Checks the engine against an independent implementation of the same spec, checks
      # productScan against compute() product by product, pins the 月別推移 month rows to
      # the workbook's formulas, opens the hand-written .xlsx export to confirm it still
      # satisfies the analyzer's column contract, and loads the page in both languages.
      - name: Run the checks
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python tools/verify.py
