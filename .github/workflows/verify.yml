name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each check is its own step, so a failure names itself in the run summary rather than
# hiding inside one long log. `python tools/verify.py` runs the same set locally.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the spreadsheet reader
        run: pip install openpyxl

      # the smoke test drives this through --dump-dom; no automation library needed
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Versions
        run: |
          node --version
          python --version
          "${{ steps.chrome.outputs.chrome-path }}" --version || google-chrome --version

      - name: Engine vs the independent Python reference
        run: |
          node tools/run_engine.js . tools/scenarios.json > /tmp/engine.json
          python tools/reference_impl.py . tools/scenarios.json > /tmp/reference.json
          python tools/compare.py /tmp/engine.json /tmp/reference.json

      - name: productScan vs compute(), per product
        run: node tools/check_product_scan.js

      - name: Month rows vs the workbook formulas
        run: node tools/check_month_rows.js

      - name: The exported .xlsx against the analyzer contract
        run: python tools/check_xlsx_export.py

      - name: The page renders, in both languages
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python tools/smoke_test.py
