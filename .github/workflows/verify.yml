name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the spreadsheet reader
        run: pip install openpyxl

      # Checks the engine against an independent implementation of the same spec, checks
      # productScan against compute() product by product, and opens the hand-written .xlsx
      # export to confirm it still satisfies the analyzer's column contract.
      - name: Run the checks
        run: python tools/verify.py
